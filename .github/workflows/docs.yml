name: Validate documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install mkdocs-material==9.7.7 mkdocs-glightbox==0.5.2
      # --strict fails CI on any broken internal link, missing nav entry, or invalid anchor.
      - run: mkdocs build --strict
